name: tmda
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_icons: ^2.0.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  dio: ^5.2.1+1
  hive_flutter: ^1.1.0
  get_it: ^9.3.0
  dartz: ^0.10.1
  flutter_secure_storage: ^11.2.0
  hive: ^2.2.3
  url_launcher: ^6.1.11
  carousel_slider: ^5.1.2
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^4.0.7
  flutter_screenutil: ^5.8.4
  flutter_svg: ^2.0.7
  auto_route: ^11.2.0
  bloc_concurrency: ^0.3.0
  lottie: ^3.8.2
  injectable: ^3.0.0
  intl: ^0.20.3
  rxdart: ^0.28.0
  flutter_cache_manager: ^3.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.6.0
  injectable_generator:
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_logo.png
    - assets/images/neon_button.png
    - assets/images/play_button.svg
    - assets/lottie/neon_loading.json
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
    - family: SolarSystem
      fonts:
        - asset: assets/fonts/SolarSystem.ttf
